name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms: the plugin is used on Windows and the host half is plain Node
        # with zero runtime dependencies, so neither one is the "real" target.
        # Both Node lines: `22.x` is the floor `engines` declares, `24.x` is the version
        # this plugin is developed on — testing only one of them is how a
        # Node-version-specific test invocation slipped through once already.
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Builds lib/ and client.js, checks the manifest and the client bundle shape, and
      # fails if any artifact is not byte-identical to the src/ module it came from.
      - name: Build and check
        run: npm run check
      - name: Tests
        run: npm test
